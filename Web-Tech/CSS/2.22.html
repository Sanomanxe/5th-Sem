<!DOCTYPE html>
<html>
<head>
    <title>Max-Width Example</title>
    <style>
        body {
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;     /* Maximum width */
            background-color: #ffffff;
            margin: auto;         /* Center the div */
            padding: 20px;
            border: 2px solid #333;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>CSS Max-Width Property</h2>
        <p>
            This container uses the max-width property.
            Resize the browser window to see how the width
            adjusts automatically.
        </p>
    </div>

</body>
</html>
