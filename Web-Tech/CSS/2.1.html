<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS Example</title>
</head>
<body>

    <h1 style="color: darkblue; text-align: center;">Welcome to My Page</h1>

    <p style="font-size: 16px; color: gray;">
        This paragraph uses inline CSS for text styling.
    </p>

    <div style="background-color: lightyellow; padding: 10px; border: 1px solid black;">
        This is a div with inline styling.
    </div>

    <ul style="list-style-type: square; color: green;">
        <li style="font-weight: bold;">Item One</li>
        <li style="font-style: italic;">Item Two</li>
    </ul>

    <button style="background-color: teal; color: white; padding: 8px 12px; border: none;">
        Click Me
    </button>

</body>
</html>
