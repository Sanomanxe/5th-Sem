<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Styling Example</title>
  <style>
    .styled-text {
      color: #4a90e2;
      letter-spacing: 3px;
      word-spacing: 10px;
      text-align: center;
      text-decoration: underline;
      text-transform: uppercase;
      text-shadow: 2px 2px 5px gray;
      font-size: 24px;
    }
  </style>
</head>
<body>
  <p class="styled-text">
    Styling Text With CSS
  </p>
</body>
</html>
