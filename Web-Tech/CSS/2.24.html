<!DOCTYPE html>
<html>
<head>
    <title>CSS Float Example</title>
    <style>
        .container {
            width: 100%;
        }

        .box {
            width: 120px;
            height: 80px;
            background-color: lightblue;
            border: 2px solid #000;
            text-align: center;
            line-height: 80px;
            font-weight: bold;
            margin: 10px;
            float: right;   /* Float boxes to the left */
        }

        .clear {
            clear: both;
        }
    </style>
</head>

<body>

    <h2>CSS Float Property Example</h2>

    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
        <div class="box">Box 4</div>

        <div class="clear"></div>
    </div>

</body>
</html>
