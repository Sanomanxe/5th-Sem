<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time Table</title>

<style>
  body {
    font-family: 'Times New Roman', Times, serif;
    background-color: #f5f5f5;
  }

  table {
    border-collapse: collapse;
    margin: 40px auto;
    width: 80%;
    background-color: white;
  }

  caption {
    font-size: 22px;
    font-weight: bold;
    padding: 10px;
    background-color: #e0e0e0;
    border: 1px solid #999;
  }

  th, td {
    border: 1px solid #999;
    padding: 8px;
    text-align: center;
  }

  th {
    background-color: #d9d9d9;
  }


</style>
</head>

<body>

<table>
  <caption>Time Table</caption>

  <tr>
    <th rowspan="7"><b>Hours</b></th>
    <th>Mon</th>
    <th>Tue</th>
    <th>Wed</th>
    <th>Thu</th>
    <th>Fri</th>
  </tr>

  <tr>
    <td>Computer</td>
    <td>Computer</td>
    <td>Computer</td>
    <td>Computer</td>
    <td>Computer</td>
  </tr>

  <tr>
    <td>Maths</td>
    <td>Maths</td>
    <td>Maths</td>
    <td>Maths</td>
    <td>Maths</td>
  </tr>

  <tr>
    <td colspan="5">Lunch</td>
  </tr>

  <tr>
    <td>Science</td>
    <td>Science</td>
    <td>Science</td>
    <td>Science</td>
    <td>Science</td>
  </tr>

  <tr>
    <td>Business</td>
    <td>Business</td>
    <td>Business</td>
    <td>Business</td>
    <td rowspan="2">Project</td>
  </tr>

  <tr>
    <td>Arts</td>
    <td>Arts</td>
    <td>Arts</td>
    <td>Arts</td>
  </tr>

</table>

</body>
</html>
