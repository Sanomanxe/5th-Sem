<!DOCTYPE html>
<html>
<head>
    <title>Background Image Example</title>
    <style>
        body {
            background-image: url('dean.jpg');
            background-repeat: no-repeat;  
            background-position: center top;   
            background-size: cover;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding-top: 50px;
            height: 100vh;
        }
        h1 {
            background-color: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
        }
        p {
            background-color: rgba(0,0,0,0.5);
            display: inline-block;
            padding: 10px 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>Welcome to The Assylum</h1>
    <p>This page demonstrates THE GOAT.</p>
</body>
</html>
