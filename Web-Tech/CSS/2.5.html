<!DOCTYPE html>
<html>
<head>
    <title>Universal Selector Example</title>

    <style>
        /* Universal selector */
        * {
            color: red;
            background-color: yellow;
            font-family: "Times New Roman";
        }
    </style>
</head>
<body>

    <h1>Welcome to My Webpage</h1>

    <p>
        This is a paragraph designed using the universal selector in CSS.
        All elements on this page share the same style.
    </p>

    <p>
        Universal selector applies styles to every HTML element.
    </p>

</body>
</html>
