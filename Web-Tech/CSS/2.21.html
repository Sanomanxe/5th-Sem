<!DOCTYPE html>
<html>
<head>
    <title>Horizontal Menu</title>
    <style>
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            display: inline;   /* Makes list horizontal */
            margin-right: 15px;
        }

        a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h3>Horizontal Menu</h3>

    <ul>
        <li><a href="#">HTML</a></li>
        <li><a href="#">CSS</a></li>
        <li><a href="#">JavaScript</a></li>
    </ul>

</body>
</html>
