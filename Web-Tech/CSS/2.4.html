<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Selectors</title>

    <style>
        /* Simple selectors */
        h1 {
            color: blue;
        }

        p {
            color: gray;
        }

        .box {
            background-color: lightyellow;
            padding: 10px;
            border: 1px solid black;
        }

        /* Grouping selector */
        h1, p, li {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>CSS Selectors Demo</h1>

    <p>This is a paragraph.</p>

    <div class="box">This is a div.</div>

    <p>This is another paragraph.</p>

    <ul>
        <li>Item One</li>
        <li>Item Two</li>
    </ul>

</body>
</html>
