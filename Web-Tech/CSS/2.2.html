<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS Example</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            color: darkred;
            text-align: center;
        }

        p {
            color: #333;
            font-size: 16px;
        }

        .box {
            background-color: lightblue;
            padding: 15px;
            border: 2px solid navy;
        }

        ul {
            color: green;
        }

        button {
            background-color: purple;
            color: white;
            padding: 8px 12px;
            border: none;
        }
    </style>
</head>
<body>

    <h1>Internal CSS Demo</h1>

    <p>This paragraph is styled using internal CSS.</p>

    <div class="box">
        This div uses a class styled in internal CSS.
    </div>

    <ul>
        <li>First item</li>
        <li>Second item</li>
    </ul>

    <button>Click Me</button>

</body>
</html>
