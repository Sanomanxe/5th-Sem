<!DOCTYPE html>
<html>
<head>
  <title>Lab1</title>
</head>
<body>

<script>
// VAR
var age = 25;          // Number
var name = "Sudip";    // String
document.write("VAR: Age = " + age + ", Name = " + name + "<br>");

// LET
let city = "Paris";    // String
let score = 100;       // Number
document.write("LET: City = " + city + ", Score = " + score + "<br>");

// CONST
const pi = 3.14;       // Number
const country = "France"; // String
document.write("CONST: Pi = " + pi + ", Country = " + country + "<br>");

// Changing values
age = 30;            
city = "Kathmandu";      
//pi = 3.141; 

document.write("After change -> VAR: Age = " + age + "<br>");
document.write("After change -> LET: City = " + city + "<br>");
document.write("CONST remains: Pi = " + pi + "<br>");
</script>

</body>
</html>
